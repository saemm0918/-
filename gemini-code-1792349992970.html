<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>리쿠폰 - Sakuya & Riku</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* 아이폰 프레임 디자인 */
        .iphone-frame {
            width: 390px;
            height: 844px;
            background: #000;
            border-radius: 50px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 
                        0 0 0 12px #333, 
                        0 0 0 14px #222;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 아이폰 화면 배경 및 내부 컨테이너 */
        .iphone-screen {
            flex: 1;
            background: linear-gradient(135deg, #fbcfe8 0%, #f472b6 50%, #db2777 100%);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border-radius: 40px;
        }

        /* 다이내믹 아일랜드 & 상태바 */
        .status-bar {
            height: 44px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            z-index: 100;
        }

        .dynamic-island {
            position: absolute;
            top: 11px;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            height: 28px;
            background: #000;
            border-radius: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 8px;
            cursor: pointer;
            z-index: 101;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: width 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .dynamic-island:hover {
            width: 140px;
        }

        .island-cam {
            width: 11px;
            height: 11px;
            background: #111;
            border-radius: 50%;
            border: 1px solid #333;
        }

        .island-text {
            color: #fff;
            font-size: 10px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 홈 화면 앱 그리드 영역 */
        .home-screen {
            flex: 1;
            padding: 40px 24px 20px 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 10;
        }

        .widget-area {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 20px;
            color: #fff;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.4);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .widget-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .widget-info h3 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .widget-info p {
            font-size: 12px;
            opacity: 0.9;
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px 15px;
            padding: 10px 0;
        }

        .app-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .app-icon:active {
            transform: scale(0.92);
        }

        .app-box {
            width: 60px;
            height: 60px;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 26px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
        }

        .app-name {
            font-size: 11px;
            color: #fff;
            font-weight: 500;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }

        /* 하단 독 바 (Dock) */
        .dock-bar {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            margin: 0 16px 16px 16px;
            padding: 12px 18px;
            border-radius: 30px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .dock-icon {
            width: 52px;
            height: 52px;
            border-radius: 13px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        .dock-icon:active {
            transform: scale(0.92);
        }

        /* 앱 공통 모달 창 스타일 */
        .app-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #f8fafc;
            z-index: 200;
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.1, 0.9, 0.2, 1);
            border-radius: 40px;
            overflow: hidden;
        }

        .app-modal.active {
            transform: translateY(0);
        }

        .modal-header {
            height: 60px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            border-bottom: 1px solid #e2e8f0;
            font-weight: 700;
            font-size: 16px;
            color: #1e293b;
        }

        .back-btn {
            background: none;
            border: none;
            font-size: 16px;
            color: #ec4899;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .modal-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        /* 1. 사진첩 스타일 */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        .photo-card {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            padding-bottom: 10px;
        }
        .photo-img {
            width: 100%;
            height: 130px;
            background: #cbd5e1;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            color: #64748b;
        }
        .photo-caption {
            font-size: 12px;
            color: #334155;
            padding: 8px 10px 0 10px;
            font-weight: 600;
        }
        .photo-date {
            font-size: 10px;
            color: #94a3b8;
            padding: 0 10px;
        }

        /* 2. 메시지(톡) 스타일 */
        .chat-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .chat-bubble {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 13px;
            line-height: 1.4;
        }
        .chat-bubble.sakuya {
            background: #e2e8f0;
            color: #1e293b;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .chat-bubble.riku {
            background: #ec4899;
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        /* 3. 메모장 스타일 */
        .note-card {
            background: #fef08a;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            color: #713f12;
            font-size: 13px;
            line-height: 1.5;
        }
        .note-card h4 {
            font-size: 14px;
            margin-bottom: 6px;
            font-weight: 700;
        }

        /* 4. 쿠폰북 스타일 */
        .coupon-card {
            background: linear-gradient(135deg, #fff1f2 0%, #ffe4e6 100%);
            border: 2px dashed #f43f5e;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .coupon-info h4 {
            color: #881337;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .coupon-info p {
            color: #9f1239;
            font-size: 11px;
        }
        .coupon-btn {
            background: #f43f5e;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        /* 토
